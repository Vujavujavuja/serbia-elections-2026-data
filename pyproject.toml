[project]
name = "edata"
version = "0.1.0"
description = "Collectors for public data on Serbia's 25 October 2026 parliamentary elections"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "lxml>=5.2",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "shapely>=2.2.0",
    "xlrd>=2.0",
]

[project.scripts]
edata = "edata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edata"]
